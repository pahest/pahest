[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pahest"
dynamic = ["version"]
description = "Full local backups of your Claude Code and Codex sessions on macOS, readable offline."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Environment :: Console",
  "Topic :: System :: Archiving :: Backup",
]

[project.urls]
Homepage = "https://github.com/pahest/pahest"

[project.scripts]
pahest = "pahest.cli:main"

[tool.setuptools.dynamic]
version = { attr = "pahest.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pahest = ["templates/*"]
